<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LANTERN 测试视口</title><style>body{font:16px system-ui;margin:16px;background:#e9eef4;color:#132234}iframe{width:390px;height:844px;border:1px solid #667;display:block;background:white}button{font:inherit;margin:0 8px 12px 0;padding:8px 16px}</style><h1>响应式布局测试</h1><p>固定 iframe 宽度，只验证 CSS 布局，不模拟手机系统、触摸、DPR 或原生 WebView。</p><button onclick="document.querySelector('iframe').style.width='390px'">390px</button><button onclick="document.querySelector('iframe').style.width='320px'">320px</button><button onclick="const d=document.querySelector('iframe').contentDocument;document.querySelector('output').textContent=JSON.stringify({width:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,bodyScrollWidth:d.body.scrollWidth,images:[...d.images].map(i=>({alt:i.alt,width:i.naturalWidth,height:i.naturalHeight})),ua:navigator.userAgent})">检查布局</button><output style="display:block;max-width:700px;overflow-wrap:anywhere"></output><iframe title="LANTERN 测试页面" src="/"></iframe></html>
