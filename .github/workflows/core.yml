name: Core validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Initialize dependencies and verify core behavior (shared with Codex)
        run: bash scripts/codex-setup.sh
      - name: Verify bounded build cleanup
        run: node --test tests/build-timeout.test.cjs
      - run: npm run build
      - name: Verify built HTML and UI component contracts
        run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify release preparation and version-code checks
        run: python -B -m unittest discover -s tests -p 'test_release_*.py'
      - name: Convert an original printable-protected PDF through real Poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install reportlab==4.4.9
          python tests/fixtures/create-page-packer-fixture.py --out-dir "$RUNNER_TEMP/lantern-page-pack-qa" --printable-protected
          node scripts/pack-exam-pages.cjs --recipe "$RUNNER_TEMP/lantern-page-pack-qa/recipe.json"
      - name: Build shared app and run real-browser mock-exam regression
        env:
          LANTERN_BROWSER_QA_DIR: ${{ runner.temp }}/lantern-browser-qa
          LANTERN_DICTIONARY_QA_DIR: ${{ runner.temp }}/lantern-dictionary-browser-qa
          LANTERN_PAGE_PACK_QA_DIR: ${{ runner.temp }}/lantern-page-pack-qa
        run: |
          npm --prefix mobile run build
          node node_modules/playwright/cli.js install --with-deps chromium
          npm run test:browser
          npm run test:dictionary:browser
      - name: Retain synthetic browser QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lantern-browser-qa/result.json
            ${{ runner.temp }}/lantern-browser-qa/*.png
            ${{ runner.temp }}/lantern-dictionary-browser-qa/result.json
            ${{ runner.temp }}/lantern-dictionary-browser-qa/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Apply migrations to an empty local SQLite database
        run: |
          python3 - <<'PY'
          import pathlib, sqlite3
          db = sqlite3.connect(':memory:')
          for migration in sorted(pathlib.Path('drizzle').glob('*.sql')):
              db.executescript(migration.read_text())
          required = {'profiles', 'attempts', 'checkins', 'recordings', 'question_marks', 'resource_tasks'}
          tables = {r[0] for r in db.execute("select name from sqlite_master where type='table'")}
          assert required <= tables
          print('Local SQLite migration smoke check passed; not a production migration.')
          PY
