# Unsigned simulator compilation only; does not produce an iPhone installation package.
name: iOS simulator build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'content/**'
      - 'public/**'
      - 'mobile/**'
      - 'build/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.openai/hosting.json'
      - '.github/workflows/ios-simulator.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/**'
      - 'content/**'
      - 'public/**'
      - 'mobile/**'
      - 'build/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.openai/hosting.json'
      - '.github/workflows/ios-simulator.yml'

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Verify Xcode 26 or newer
        run: |
          xcodebuild -version
          python3 - <<'PYCODE'
          import re, subprocess
          version = subprocess.check_output(['xcodebuild', '-version'], text=True)
          major = int(re.search(r'Xcode (\d+)', version).group(1))
          assert major >= 26, f'Capacitor 8 requires Xcode 26+: {version}'
          PYCODE
      - name: Install shared frontend dependencies
        run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Build local mobile web assets
        working-directory: mobile
        run: npm run build
      - name: Sync iOS project
        working-directory: mobile
        run: npx cap sync ios
      - name: Compile unsigned simulator app
        working-directory: mobile
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios-build \
            -resultBundlePath ios-build-result.xcresult \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios-build.log
      - name: Upload simulator compiler evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lantern-toeic-ios-simulator-check-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            mobile/ios-build.log
            mobile/ios-build-result.xcresult
          if-no-files-found: warn
          retention-days: 14
